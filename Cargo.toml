[package]
name = "easy-mic"
version = "1.3.0"
edition = "2021"
authors = ["jsoul-dev"]
description = "Lightweight global microphone controller for Windows (Rust rewrite fork of k1tbyte easymic)"
repository = "https://github.com/jsoul-dev/easy-mic"
license = "Apache-2.0"

[[bin]]
name = "Easy-Mic"
path = "src/main.rs"

[dependencies]
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_UI_Controls_Dialogs",
] }
windows-core = "0.58"
crossbeam-channel = "0.5"
parking_lot = "0.12"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
chrono = "0.4"
